<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stand-in reader</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2b2b; }
canvas { position: fixed; left: 0; top: 0; display: block; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script>
"use strict";
/* DEVELOPER TOOL, NOT PART OF THE APPLICATION: the browser-type stand-in viewer (tools/standin_viewer).

A page of its own, run in a throwaway browser window, that draws sample pages the way a browser-based e-book reader
does: a band at the top that is not the page, a dark ground round the page or the spread (right to left: the first
page of a spread on the right), a small page counter; every turn drawn SOFT first (the page drawn into a canvas six
times smaller and enlarged again, as the browser itself scales a canvas) and sharp a while later; BLACK for a while
when the window gets the focus, a key pressed meanwhile lost; now and then a spinner over the page. With
``soft_first=0`` in the query every turn is drawn sharp at once and nothing is drawn after it (the script's t, b and k
steps change nothing then): a viewer that never draws a page soft, for timing what TASlation itself takes.

Nothing is fetched from anywhere: no network, no external resource. The query names two files in a scratch folder,
both loaded as scripts: the page list (`pages`, `standinPages({...})`: file URLs of the pictures, read where they
are) and the control file (`control`, `standinControl({...})`, looked at every CONTROL_MS: what the driver releases).
Without a page list it draws placeholder pages of its own.

The hash holds the script (`#s=...`), steps separated by commas, run by the page itself:
  gN wait until the control file's "go" is N or more   wN wait N ms     wA-B wait A..B ms (seeded)
  n next screen    p previous screen    jN jump to page N (from 0)
  f flash black (flash_ms)    fN flash black N ms    sN spinner over the page N ms
  tN the turns after drawn soft for N ms    t the soft time of the query again
  bN the turns after drawn soft N times smaller    b the factor of the query again
  mN a mark (said in the log)    e the end
  hN wait until the control file's "hold" is N or more (a rest held until the driver lets it go)
  kN the turns after kept soft until the control file's "sharp" is their number or more (the turns kept so far,
     counted from 1), N ms at most    k drawn sharp after the soft time again
  u wait for the next turn the control file's "turns" releases (it grows by one for each: a page key TASlation
    handed on, or the driver's own release)
Arrow keys work for a person trying it by hand: Left the next screen, Right the one before (a book read right to
left).

With ``slider=1`` in the query a page slider lies under the page, as a viewer's own: a thin bar with a round knob at
the place of the screen on show, the first page at the right end (a book read right to left). It listens to the
pointer events on the canvas (pointerdown, pointermove, pointerup, pointercancel, lostpointercapture) as a common web
slider does: a press on the knob takes the pointer (setPointerCapture) and the knob follows it while the button is
held; a press on the bar puts the knob there and takes the pointer as well; the release goes to the page at the
knob's place (``ev=jump from=.. to=.. by=drag|click``; the same page: ``ev=stay``). With ``slider=2`` the page under
the knob is drawn as it moves (``why=preview``, sharp at once), as a viewer that previews the pages while its slider is
dragged; the release turns to it as ``slider=1`` does. A press elsewhere does nothing but is said (``ev=pointer``,
with the moves counted at its release), and so are the DOM's click events (``ev=click``). Without it nothing of this
is drawn or listened to.

With ``profile=dark`` or ``profile=light`` in the query it behaves as one of two kinds of web viewer (as recordings of
them showed; their look is not copied): the band stands for the browser's own tabs and address bar and is drawn only
while the window does not fill the screen (a browser's full screen has none); under it the viewer's area, the page
fitted to its height, a spread centred on the ground (black or white), the cover and a last page alone single and
centred; every turn drawn sharp at once (``soft_first=1`` brings the soft first back); bars that lie OVER the page and
fade in and out, side arrows, a slider in the bottom bar (drag the knob or click the bar), what a jump and a resize
draw. Each part has its own name in the query (`PROFILES` gives both profiles' values, `PROFILE_CHOICES` the words a
part takes): ground, cover, bars (none, edge, click, move), bar_top, bar_bottom, bar_style (solid, glass), bar_fade_ms,
bar_hide_ms, bar_key_hide, arrows (none, edge, inset), arrow_show (move, always), arrow_hide_ms, arrow_inset,
page_clicks, ground_clicks, jump (plain, spinner), jump_ms (A-B), jump_half, half_ms, preview, preview_ms, resize
(plain, spinner), resize_ms (A-B), focus_black, counter. With a profile the page also says: ``ev=turn dir= by=key|arrow|
ground|page|script`` (a click's place, x= y= in the canvas's pixels), ``ev=key``, ``ev=bars on= why= fade=`` and
``ev=bars_done on=``, ``ev=arrows on= why=``, ``ev=spinner on=1 why=jump|resize ms=`` and ``on=0`` (the viewer's area
black with a small spinner: its cells say spinner), ``ev=preview on=1 ms=`` and ``on=0``, ``ev=draw ... kind=half|preview
pages=N`` (one page of a spread first, the other black; the target washed out: both said and coded soft), ``ev=size ...
full= band=``, ``ev=blur``. Two more steps of the script: ``vN`` the bars shown for N ms (2000), as the pointer shows
them, not waited on; ``a`` the side arrows shown as a pointer move shows them. Its n and p hide the bars as a key does.

What it does is said on the console (`STANDIN ev=... t=...`, the time in ms since the epoch; a draw with the page's
rectangle and the band's height in the canvas's pixels), which the driver reads from the browser's log; the title
stays as it is, as a reader's tab title does. A strip of cells in the band carries the screen on show (its first
page, spread or single, soft or sharp, spinner or not) for the driver to tell the frames TASlation captured apart;
nothing else reads it. */

const CONTROL_MS = 100;
const CELL = 6, CODE_X = 12, CODE_Y = 12;  // the code's cells, CSS pixels from the content's top left
const GROUND = "#2b2b2b", BAND = "#3a3d41", BAND_LINE = "#56595e", BAND_PART = "#4a4e53", COUNTER = "#9a9a9a";

const query = new URLSearchParams(location.search);
const hashed = new URLSearchParams(location.hash.slice(1));
const num = (name, fallback) => { const v = Number(query.get(name)); return query.has(name) && isFinite(v) ? v : fallback; };
const cfg = {
  token: query.get("token") || "",
  pages: query.get("pages") || "",
  control: query.get("control") || "",
  seed: num("seed", 1),
  softMin: num("soft_min", 150), softMax: num("soft_max", 400),
  factor: Math.max(2, num("factor", 6)),
  flashMs: num("flash_ms", 800),
  band: num("band", 54),
  layout: query.get("layout") || "auto",  // "auto" (spreads while the window is wider than high), "spread", "single"
  softFirst: query.get("soft_first") !== "0",  // false: every turn drawn sharp at once, nothing after it
  slider: ["1", "2"].includes(query.get("slider")) ? Number(query.get("slider")) : 0,  // the page slider under the page
  script: hashed.get("s") || "",
  focusBlack: query.get("focus_black") !== "0",  // false: the focus draws no black
};

// ------------------------------------------------------------------------------------------------ the profiles
/* PROFILE LOGIC BEGIN - pure functions and tables, nothing drawn (tests/test_standin_profiles.py runs them in node) */
// The behaviour of two kinds of web viewer (``profile=dark|light`` in the query), each part switchable alone by its
// own name in the query (`PROFILE_OPTIONS`); ``bar_hide_ms`` empty: by the bars' way (edge 1000, move 3000 ms).
const PROFILES = {
  dark: { ground: "black", cover: 1, bars: "edge", bar_top: 94, bar_bottom: 56, bar_style: "solid",
          bar_fade_ms: 200, bar_hide_ms: "", bar_key_hide: 1, arrows: "edge", arrow_show: "move",
          arrow_hide_ms: 3000, arrow_inset: 0, page_clicks: 0, ground_clicks: 1, jump: "spinner", jump_ms: "500-1100",
          jump_half: 0.25, half_ms: 2000, preview: 0, preview_ms: 200, resize: "spinner", resize_ms: "400-500",
          focus_black: 0, counter: "percent" },
  light: { ground: "white", cover: 1, bars: "move", bar_top: 40, bar_bottom: 40, bar_style: "glass",
           bar_fade_ms: 200, bar_hide_ms: "", bar_key_hide: 0, arrows: "inset", arrow_show: "always",
           arrow_hide_ms: 3000, arrow_inset: 180, page_clicks: 1, ground_clicks: 0, jump: "plain", jump_ms: "0",
           jump_half: 0,
           half_ms: 2000, preview: 1, preview_ms: 200, resize: "plain", resize_ms: "0", focus_black: 0,
           counter: "pages" },
};
const PROFILE_CHOICES = { ground: ["black", "white"], bars: ["none", "edge", "click", "move"],
                          bar_style: ["solid", "glass"], arrows: ["none", "edge", "inset"],
                          arrow_show: ["move", "always"], jump: ["plain", "spinner"], resize: ["plain", "spinner"],
                          counter: ["percent", "pages"] };
const PROFILE_OPTIONS = Object.keys(PROFILES.dark);
const BAR_HIDE_MS = { edge: 1000, move: 3000, click: 0, none: 0 };

function rangeOf(text, fallback) {  // "A-B" or "A" (ms) -> [low, high]
  const m = /^(\d+)(?:-(\d+))?$/.exec(String(text).trim());
  if (!m) return fallback;
  const a = Number(m[1]), b = m[2] === undefined ? a : Number(m[2]);
  return [Math.min(a, b), Math.max(a, b)];
}
function profileOptions(name, get) {  // the profile *name* with what get(option) gives instead (null: its own)
  const base = PROFILES[name];
  if (!base) return null;
  const out = {};
  for (const key of PROFILE_OPTIONS) {
    const given = get(key), fallback = base[key];
    let value = given === null || given === undefined || given === "" ? fallback : given;
    if (PROFILE_CHOICES[key]) value = PROFILE_CHOICES[key].includes(String(value)) ? String(value) : fallback;
    else if (key === "jump_ms" || key === "resize_ms") value = rangeOf(value, rangeOf(fallback, [0, 0]));
    else if (key === "bar_hide_ms") value = value === "" ? null : (isFinite(Number(value)) ? Number(value) : null);
    else value = isFinite(Number(value)) ? Number(value) : Number(fallback);
    out[key] = value;
  }
  if (out.bar_hide_ms === null) out.bar_hide_ms = BAR_HIDE_MS[out.bars];
  out.jump_half = Math.max(0, Math.min(1, out.jump_half));
  return out;
}
function screenOf(n, count, spreads, cover) {  // the first page of the screen that holds page n
  n = Math.max(0, Math.min(Math.max(0, count - 1), n));
  if (!spreads) return n;
  if (!cover) return n - (n % 2);
  return n === 0 ? 0 : n - ((n - 1) % 2);  // the cover alone, then pages 1-2, 3-4, ...
}
function screenPagesOf(f, count, spreads, cover) {
  if (!spreads || (cover && f === 0) || f + 1 >= count) return [f];
  return [f, f + 1];
}
function nextScreen(f, count, spreads, cover) {
  return screenOf(f + screenPagesOf(f, count, spreads, cover).length, count, spreads, cover);
}
function previousScreen(f, count, spreads, cover) {
  return f <= 0 ? 0 : screenOf(f - 1, count, spreads, cover);
}
function fitRects(sizes, area) {  // pages [w, h] fitted to the area's height (or its width, if narrower), centred;
  const tall = Math.max(...sizes.map(s => s[1]));  // the first page on the right (a book read right to left)
  const widths = sizes.map(s => s[0] * tall / s[1]);
  const total = widths.reduce((a, b) => a + b, 0);
  const scale = Math.min(area.h / tall, area.w / total);
  const h = Math.max(1, Math.round(tall * scale));
  const ws = widths.map(w => Math.max(1, Math.round(w * scale)));
  const all = ws.reduce((a, b) => a + b, 0);
  let right = area.x + Math.round((area.w + all) / 2);
  const top = area.y + Math.round((area.h - h) / 2);
  return ws.map(w => { const r = { x: right - w, y: top, w, h }; right -= w; return r; });
}
function thirdOf(x, x0, x1) {  // where on the page (from x0 to x1) a click at x is: left, middle, right; null beside it
  if (x < x0 || x > x1) return null;
  const t = (x - x0) / Math.max(1, x1 - x0);
  return t < 1 / 3 ? "left" : t > 2 / 3 ? "right" : "middle";
}
function inEdge(y, area, top, bottom) {  // the pointer in the band of the top bar or of the bottom bar
  return (y >= area.y && y < area.y + top) || (y >= area.y + area.h - bottom && y <= area.y + area.h);
}
function arrowRects(area, kind, inset, d) {  // the side arrows: tabs at the very edges, or round buttons set in
  if (kind === "edge") {
    const w = Math.round(32 * d), h = Math.round(70 * d), y = area.y + Math.round((area.h - h) / 2);
    return { left: { x: area.x, y, w, h }, right: { x: area.x + area.w - w, y, w, h } };
  }
  if (kind === "inset") {
    const s = Math.round(30 * d), y = area.y + Math.round((area.h - s) / 2), x = Math.round(inset * d);
    return { left: { x: area.x + x, y, w: s, h: s }, right: { x: area.x + area.w - x - s, y, w: s, h: s } };
  }
  return null;
}
function arrowsAllowed(f, count, spreads, cover) {  // right to left: the left arrow goes on, the right one back
  return { left: nextScreen(f, count, spreads, cover) !== f, right: f > 0 };
}
function inside(r, x, y) { return !!r && x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; }
/* PROFILE LOGIC END */

const P = profileOptions(query.get("profile") || "", key => query.get(key));
if (P) {
  cfg.focusBlack = query.has("focus_black") ? query.get("focus_black") !== "0" : !!P.focus_black;
  cfg.softFirst = query.get("soft_first") === "1";  // (a profile draws every turn sharp at once unless asked)
  if (!cfg.slider) cfg.slider = 1;  // (its slider lies in the bottom bar)
}
// the slider (CSS pixels): the foot under the page it lies in, the bar's ends (shares of the width; the counter on
// the right stays clear), its height, the knob's radius and how far round the knob and the bar a press takes them
const SLIDER_FOOT = 56, SLIDER_Y = 26, SLIDER_X0 = 0.12, SLIDER_X1 = 0.80, SLIDER_BAR = 4, KNOB = 8, KNOB_REACH = 14,
      BAR_REACH = 10;
const SLIDER_BAR_COLOUR = "#8a8d92", SLIDER_KNOB_COLOUR = "#e8e8e8";
const softQuery = [cfg.softMin, cfg.softMax], factorQuery = cfg.factor;  // (a script's "t" and "b" put them back)
document.title = "Stand-in reader" + (cfg.token ? " " + cfg.token : "");

// ------------------------------------------------------------------------------------------------ the log
let step = -1;
function now() { return performance.timeOrigin + performance.now(); }
function say(ev, extra) {
  console.log("STANDIN ev=" + ev + " t=" + now().toFixed(1) + " step=" + step + " page=" + index +
              " spread=" + (spread ? 1 : 0) + (extra ? " " + extra : ""));
}

// ------------------------------------------------------------------------------------------------ seeded draws
let seed = (cfg.seed >>> 0) || 1;
function random() {  // mulberry32
  seed = (seed + 0x6D2B79F5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function between(a, b) { return Math.round(a + (b - a) * random()); }

// ------------------------------------------------------------------------------------------------ the pages
let entries = [];  // {url, flip} or {placeholder: n}
const images = new Map();  // page -> Promise of a drawable

function placeholder(n) {
  const c = document.createElement("canvas");
  c.width = 830; c.height = 1170;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
  let s = (n + 1) * 7919;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  g.fillStyle = "#222222";
  for (let k = 0; k < 7; k++) g.fillRect(30 + r() * 600, 30 + r() * 950, 40 + r() * 160, 40 + r() * 160);
  g.strokeStyle = "#000000"; g.lineWidth = 4;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(120 + r() * 560, 140 + r() * 860, 70, 110, 0, 0, Math.PI * 2); g.stroke(); }
  g.font = "bold 120px sans-serif"; g.fillStyle = "#cccccc"; g.fillText(String(n + 1), 340, 640);
  return c;
}

function load(n) {
  if (n < 0 || n >= entries.length) return null;
  if (!images.has(n)) {
    const e = entries[n];
    images.set(n, e.url ? new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ img, flip: e.flip || "" });
      img.onerror = () => resolve({ img: placeholder(n), flip: "" });
      img.src = e.url;
    }) : Promise.resolve({ img: placeholder(n), flip: "" }));
  }
  return images.get(n);
}
function keepNear(n) {  // the pictures near the one on show decoded ahead; the others let go
  for (let k = n - 4; k <= n + 6; k++) load(k);
  for (const k of [...images.keys()]) if (k < n - 8 || k > n + 10) images.delete(k);
}

// ------------------------------------------------------------------------------------------------ drawing
const view = document.getElementById("view");
const g = view.getContext("2d");
let index = 0, spread = true, shown = "none", spinning = false, black = false;
let base = null;  // the screen drawn sharp last (for the spinner's frames)
let pendingSharp = null, drawToken = 0;
let keepMs = null, keptTurns = 0, keeping = 0;  // a script's "kN": the turns kept soft until the driver's word
const dpr = () => window.devicePixelRatio || 1;
const wide = img => img.naturalWidth || img.width, high = img => img.naturalHeight || img.height;

function sizeCanvas() {
  const d = dpr(), w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (view.width !== w || view.height !== h) {
    view.width = w; view.height = h;
    view.style.width = innerWidth + "px"; view.style.height = innerHeight + "px";
    return true;
  }
  return false;
}
function spreadNow() {
  return cfg.layout === "spread" || (cfg.layout !== "single" && view.width > view.height * 1.05);
}
function first(n) {
  if (P) return screenOf(n, entries.length, spread, P.cover);
  return spread ? Math.max(0, n - (n % 2)) : Math.max(0, n);
}
function screenPages() {
  if (P) return screenPagesOf(index, entries.length, spread, P.cover);
  const out = [index];
  if (spread && index + 1 < entries.length) out.push(index + 1);
  return out;
}

function band() {
  const d = dpr(), W = view.width, B = Math.round(cfg.band * d);
  g.fillStyle = BAND; g.fillRect(0, 0, W, B);
  g.fillStyle = BAND_LINE; g.fillRect(0, B - Math.max(1, Math.round(d)), W, Math.max(1, Math.round(d)));
  g.fillStyle = BAND_PART;  // the reader's own controls: a few buttons on the right, a slider in the middle
  for (let k = 0; k < 4; k++) g.fillRect(W - Math.round((44 + 40 * k) * d), Math.round(12 * d), Math.round(28 * d), Math.round(Math.min(28, cfg.band - 20) * d));
  g.fillRect(Math.round(W * 0.3), Math.round((cfg.band / 2) * d), Math.round(W * 0.35), Math.max(1, Math.round(3 * d)));
}

function code(soft, spin) {  // the screen on show, as cells: 1010, 12 bits (page, spread, soft, spinner), 4 bits of check
  const data = (index & 511) | ((spread ? 1 : 0) << 9) | ((soft ? 1 : 0) << 10) | ((spin ? 1 : 0) << 11);
  const check = ((data & 15) + ((data >> 4) & 15) * 3 + ((data >> 8) & 15) * 5 + 7) & 15;
  const bits = [1, 0, 1, 0];
  for (let k = 0; k < 12; k++) bits.push((data >> k) & 1);
  for (let k = 0; k < 4; k++) bits.push((check >> k) & 1);
  const d = dpr(), c = Math.max(1, Math.round(CELL * d)), x0 = Math.round(CODE_X * d), y0 = Math.round(CODE_Y * d);
  bits.forEach((b, k) => { g.fillStyle = b ? "#ffffff" : "#000000"; g.fillRect(x0 + k * c, y0, c, c); });
}

function rects(pics) {
  const d = dpr(), W = view.width, H = view.height, B = Math.round(cfg.band * d), m = Math.round(14 * d);
  const foot = Math.round((cfg.slider ? SLIDER_FOOT : 20) * d);
  const tall = Math.max(...pics.map(p => high(p.img)));
  const widths = pics.map(p => wide(p.img) * tall / high(p.img));
  const total = widths.reduce((a, b) => a + b, 0);
  const scale = Math.min((W - 2 * m) / total, (H - B - 2 * m - foot) / tall);
  const h = Math.max(1, Math.round(tall * scale));
  const ws = widths.map(w => Math.max(1, Math.round(w * scale)));
  const all = ws.reduce((a, b) => a + b, 0);
  let right = Math.round((W + all) / 2);
  const top = B + m + Math.round((H - B - 2 * m - foot - h) / 2);
  return ws.map(w => { const r = { x: right - w, y: top, w, h }; right -= w; return r; });  // the first on the right
}

function drawPicture(ctx, pic, r, soft) {
  const { img, flip } = pic;
  ctx.save();
  ctx.translate(r.x + (flip.includes("h") ? r.w : 0), r.y + (flip.includes("v") ? r.h : 0));
  ctx.scale(flip.includes("h") ? -1 : 1, flip.includes("v") ? -1 : 1);
  ctx.imageSmoothingEnabled = true;
  if (soft) {  // a picture of the page six times smaller (through a half-size step, then sampled), enlarged
    const hw = Math.max(1, Math.round(wide(img) / 2)), hh = Math.max(1, Math.round(high(img) / 2));
    const half = document.createElement("canvas"); half.width = hw; half.height = hh;
    const hg = half.getContext("2d"); hg.imageSmoothingQuality = "high"; hg.drawImage(img, 0, 0, hw, hh);
    const sw = Math.max(1, Math.round(wide(img) / cfg.factor)), sh = Math.max(1, Math.round(high(img) / cfg.factor));
    const small = document.createElement("canvas"); small.width = sw; small.height = sh;
    const sg = small.getContext("2d"); sg.imageSmoothingQuality = "low"; sg.drawImage(half, 0, 0, sw, sh);
    ctx.imageSmoothingQuality = "low";
    ctx.drawImage(small, 0, 0, sw, sh, 0, 0, r.w, r.h);
  } else {
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, r.w, r.h);
  }
  ctx.restore();
}

function counter() {
  const d = dpr(), W = view.width, H = view.height;
  const pages = screenPages().map(p => p + 1);
  g.fillStyle = COUNTER; g.font = Math.round(12 * d) + "px sans-serif"; g.textAlign = "right"; g.textBaseline = "bottom";
  g.fillText(pages.join("-") + " / " + entries.length, W - Math.round(16 * d), H - Math.round(6 * d));
}

// ------------------------------------------------------------------------------------------------ the slider
let dragging = null;  // a press the slider took: {id, from, by, offset, knob, moves, events}
let pressed = null;   // a press elsewhere: {id, moves}
function track() {  // the bar in the canvas's pixels: its ends and its middle's row
  const d = dpr(), W = view.width, H = view.height;
  if (P) {  // in the bottom bar: across nearly all of it (dark), or in its middle (light)
    const a = viewerArea(), foot = Math.round(P.bar_bottom * d);
    if (P.bar_style === "solid")
      return { x0: a.x + Math.round(a.w * 0.03), x1: a.x + Math.round(a.w * 0.97), y: a.y + a.h - foot + Math.round(20 * d) };
    return { x0: a.x + Math.round(a.w * 0.30), x1: a.x + Math.round(a.w * 0.70), y: a.y + a.h - Math.round(foot / 2) };
  }
  return { x0: Math.round(W * SLIDER_X0), x1: Math.round(W * SLIDER_X1), y: H - Math.round(SLIDER_Y * d) };
}
function knobX(n) {  // the knob's place for page n: the first page at the right end
  const t = track(), last = Math.max(1, entries.length - 1);
  return Math.round(t.x1 - (Math.max(0, Math.min(last, n)) / last) * (t.x1 - t.x0));

// ------------------------------------------------------------------------------------------------ a profile's view
// The view is the page layer (ground and pages) with the bars, the side arrows, the black and its spinner over it,
// composed again whenever one of them changes (`compose`); the band (the browser's own tabs and address bar) and the
// code cells over all. The band is drawn while the window does not fill the screen (a browser's full screen has none).
const layer = document.createElement("canvas");
const lg = layer.getContext("2d");
let shownRects = [];  // the pages on show (canvas pixels)
let bars = { on: false, alpha: 0, from: 0, at: 0, why: "", hide: null };
let arrows = { on: false, hide: null };
let loading = null;  // the black with its spinner: {why, start, ms}
let animating = false;

const GROUNDS = { black: "#000000", white: "#ffffff" };

function fullScreen() { return innerWidth >= screen.width && innerHeight >= screen.height; }
function bandPx() { return P && fullScreen() ? 0 : Math.round(cfg.band * dpr()); }
function viewerArea() { const B = bandPx(); return { x: 0, y: B, w: view.width, h: Math.max(1, view.height - B) }; }
function pageBox() {
  if (!shownRects.length) return null;
  return { x0: Math.min(...shownRects.map(r => r.x)), x1: Math.max(...shownRects.map(r => r.x + r.w)),
           y0: Math.min(...shownRects.map(r => r.y)), y1: Math.max(...shownRects.map(r => r.y + r.h)) };
}
function barRects() {
  const a = viewerArea(), d = dpr(), t = Math.round(P.bar_top * d), b = Math.round(P.bar_bottom * d);
  return { top: { x: a.x, y: a.y, w: a.w, h: t }, bottom: { x: a.x, y: a.y + a.h - b, w: a.w, h: b } };
}
function barsUp() { return P.bars !== "none" && bars.on && bars.alpha > 0.5; }
function arrowsShown() {
  if (P.arrows === "none" || loading) return { left: false, right: false };
  const ok = arrowsAllowed(index, entries.length, spread, P.cover);
  const on = P.arrow_show === "always" || arrows.on;
  return { left: on && ok.left, right: on && ok.right };
}

function setBars(on, why) {  // the bars fade in or out over bar_fade_ms (said as they begin and as they end)
  if (P.bars === "none") return;
  if (bars.hide !== null) { clearTimeout(bars.hide); bars.hide = null; }
  if (bars.on === on) return;
  bars = { ...bars, on, from: bars.alpha, at: now(), why };
  say("bars", "on=" + (on ? 1 : 0) + " why=" + why + " fade=" + P.bar_fade_ms);
  animate();
}
function hideBarsLater(why) {
  if (P.bars === "none" || !bars.on || bars.hide !== null) return;
  bars.hide = setTimeout(() => { bars.hide = null; if (dragging) hideBarsLater(why); else setBars(false, why); }, P.bar_hide_ms);
}
function setArrows(on, why) {
  if (P.arrows === "none" || P.arrow_show === "always") return;
  if (arrows.hide !== null) { clearTimeout(arrows.hide); arrows.hide = null; }
  if (on) arrows.hide = setTimeout(() => { arrows.hide = null; setArrows(false, "time"); }, P.arrow_hide_ms);
  if (arrows.on === on) return;

}
function animate() {  // the bars' fade and the spinner, frame by frame while either goes on
  if (animating) return;
  animating = true;
  const frame = () => {
    const fade = P.bar_fade_ms > 0 ? Math.min(1, (now() - bars.at) / P.bar_fade_ms) : 1;
    const target = bars.on ? 1 : 0, before = bars.alpha;
    bars.alpha = bars.from + (target - bars.from) * fade;
    if (before !== target && bars.alpha === target) say("bars_done", "on=" + target);
    compose();

  };

function chevron(x, y, s, left, colour, width) {
  g.strokeStyle = colour; g.lineWidth = width; g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(x + (left ? s / 2 : -s / 2), y - s); g.lineTo(x + (left ? -s / 2 : s / 2), y);
  g.lineTo(x + (left ? s / 2 : -s / 2), y + s); g.stroke();

function drawBars() {

  const d = dpr(), r = barRects(), solid = P.bar_style === "solid";
  const ink = solid ? "#3a3a3a" : "#f2f2f2", faint = solid ? "#9a9a9a" : "#c8c8c8";
  g.save();

  g.fillRect(r.top.x, r.top.y, r.top.w, r.top.h);
  g.fillRect(r.bottom.x, r.bottom.y, r.bottom.w, r.bottom.h);
  g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "middle";
  const T = r.top, row = solid ? Math.round(T.y + 26 * d) : Math.round(T.y + T.h / 2);
  chevron(T.x + 24 * d, row, 7 * d, true, ink, 2 * d);  // back at the left
  if (solid) {  // a mark in the middle, three small controls at the right; the title and a button under them
    g.fillRect(T.x + T.w / 2 - 9 * d, row - 9 * d, 18 * d, 18 * d);
    for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(T.x + T.w - (24 + 34 * k) * d, row, 7 * d, 0, Math.PI * 2); g.fill(); }
    g.font = Math.round(14 * d) + "px sans-serif";
    g.fillText("Sample pages", T.x + T.w / 2 - 30 * d, T.y + 70 * d);
    g.strokeStyle = ink; g.lineWidth = 1.5 * d; g.strokeRect(T.x + T.w / 2 + 40 * d, T.y + 60 * d, 56 * d, 20 * d);
  } else {  // small icons at the left, the title in the middle, a search mark at the right
    for (let k = 1; k < 3; k++) g.fillRect(T.x + (24 + 30 * k) * d - 7 * d, row - 7 * d, 14 * d, 14 * d);
    g.font = Math.round(13 * d) + "px sans-serif";

    g.fillStyle = ink; g.font = Math.round(12 * d) + "px sans-serif"; g.textAlign = "left";
    g.fillText("100%", B.x + 16 * d, B.y + B.h / 2);
    g.strokeStyle = ink; g.lineWidth = 1.5 * d;
    for (let k = 0; k < 2; k++) { g.beginPath(); g.arc(B.x + (70 + 24 * k) * d, B.y + B.h / 2, 7 * d, 0, Math.PI * 2); g.stroke(); }
    g.fillText(words, t.x1 + 16 * d, B.y + B.h / 2);
  }
  g.fillStyle = solid ? "#3a3a3a" : "#ffffff";

}
function drawArrows() {
  const on = arrowsShown(), d = dpr(), rs = arrowRects(viewerArea(), P.arrows, P.arrow_inset, d);
  if (!rs) return;
  for (const side of ["left", "right"]) {
    if (!on[side]) continue;

async function drawProfile(soft, why, kind, half) {  // the screen on show into the page layer, then composed;
  const token = ++drawToken;                            // kind "preview" washed out, "half" one page of a spread
  const began = now();
  const pics = await Promise.all(screenPages().map(load));
  if (token !== drawToken || black) return false;
  sizeCanvas();
  if (layer.width !== view.width || layer.height !== view.height) { layer.width = view.width; layer.height = view.height; }
  lg.fillStyle = GROUNDS[P.ground] || GROUND; lg.fillRect(0, 0, layer.width, layer.height);
  const rs = fitRects(pics.map(p => [wide(p.img), high(p.img)]), viewerArea());
  pics.forEach((p, k) => {
    if (kind === "half" && k !== half) { lg.fillStyle = "#000000"; lg.fillRect(rs[k].x, rs[k].y, rs[k].w, rs[k].h); return; }
    if (kind === "preview") lg.filter = "grayscale(1) contrast(0.55) brightness(1.2) blur(" + (2 * dpr()) + "px)";
    drawPicture(lg, p, rs[k], soft && !kind);  // (half and preview: the page drawn sharp, the cells say soft)
    lg.filter = "none";

  shownRects = rs;
  shown = soft ? "soft" : "sharp";

  compose();

               Math.max(...rs.map(r => r.x + r.w)), Math.max(...rs.map(r => r.y + r.h))];
  say("draw", "state=" + shown + (kind ? " kind=" + kind : "") + " why=" + why + " wait=" + Math.round(now() - began) +
      " box=" + box.join(",") + " band=" + bandPx() + " pages=" + pics.length);

}
function load_then(why, ms, then) {  // the black with its spinner for ms, then *then* (none if another draw came)
  stopSharp();

  shown = "black";
  say("spinner", "on=1 why=" + why + " ms=" + ms);

    loading = null;

  keepNear(index);
  if (P.jump === "spinner") {
    load_then("jump", between(P.jump_ms[0], P.jump_ms[1]), () => {
      if (screenPages().length === 2 && random() < P.jump_half) {  // one page of the spread first, the other later
        const half = random() < 0.5 ? 0 : 1;

          if (!done) return;

          setTimeout(() => { if (token === drawToken) drawProfile(false, "sharp"); }, P.half_ms);
        });

  if (dir === "next") next(); else previous();

function profileInput() {  // pointer events on the page, as a web viewer takes them

    const [x, y] = at(e);

    if (dragging && e.pointerId === dragging.id) { dragging.events++; dragging.moves += many; moveKnob(x); return; }
    if (ptr && e.pointerId === ptr.id && e.buttons) ptr.moves += many;

      if (inEdge(y, viewerArea(), Math.round(P.bar_top * dpr()), Math.round(P.bar_bottom * dpr()))) setBars(true, "edge");
      else hideBarsLater("edge_left");

    else if (barsUp() && (inside(r.top, x, y) || inside(r.bottom, x, y))) part = "bar_area";
    else if (sides && on.left && inside(sides.left, x, y)) part = "arrow_left";
    else if (sides && on.right && inside(sides.right, x, y)) part = "arrow_right";

                   offset: part === "knob" ? x - knobX(index) : 0, knob: knobX(index), moves: 0, events: 0 };

    if (press.on === "arrow_right") { turnBy("previous", "arrow", "side=right " + where); return; }
    if (press.on !== "page") { say("pointer", "kind=released on=" + press.on); return; }
    const box = pageBox();
    const third = box ? thirdOf(x, box.x0, box.x1) : null;

  });

if (P) profileInput();

async function drawScreen(soft, why) {
  if (P) return drawProfile(soft, why);
  const token = ++drawToken;
  const began = now();
  const pics = await Promise.all(screenPages().map(load));
  if (token !== drawToken || black) return false;  // another drawing came meanwhile
  sizeCanvas();
  g.fillStyle = GROUND; g.fillRect(0, 0, view.width, view.height);
  const rs = rects(pics);
  pics.forEach((p, k) => drawPicture(g, p, rs[k], soft));
  band(); counter(); slider(); code(soft, false);
  shown = soft ? "soft" : "sharp";
  if (!soft) {
    base = document.createElement("canvas"); base.width = view.width; base.height = view.height;
    base.getContext("2d").drawImage(view, 0, 0);
  }
  // where the page is (both pages of a spread) and how high the band is, in the canvas's pixels
  const box = [Math.min(...rs.map(r => r.x)), Math.min(...rs.map(r => r.y)),
               Math.max(...rs.map(r => r.x + r.w)), Math.max(...rs.map(r => r.y + r.h))];
  say("draw", "state=" + shown + " why=" + why + " wait=" + Math.round(now() - began) + " box=" + box.join(",") +
      " band=" + Math.round(cfg.band * dpr()));
  return true;
}

function stopSharp() {  // the sharp draw due no longer comes (a turn kept soft says so)
  if (pendingSharp !== null) { clearTimeout(pendingSharp); pendingSharp = null; }
  if (keeping) { say("kept", "n=" + keeping + " why=gone"); keeping = 0; }
}
function keepSoft(token) {  // the turn on show kept soft until the control file's "sharp" reaches it, keepMs at most
  const turn = ++keptTurns, end = now() + keepMs;
  keeping = turn;
  say("keep", "n=" + turn + " ms=" + keepMs);
  const look = () => {
    pendingSharp = null;
    if (token !== drawToken) { if (keeping === turn) { say("kept", "n=" + turn + " why=gone"); keeping = 0; } return; }
    const word = control.sharp >= turn;
    if (!word && now() < end) { pendingSharp = setTimeout(look, 50); return; }
    keeping = 0;
    say("kept", "n=" + turn + " why=" + (word ? "word" : "time"));
    drawScreen(false, "sharp");
  };
  pendingSharp = setTimeout(look, 50);
}

function turnTo(n, why) {
  if (black) { say("lost", "why=" + why); return; }  // a key in the black: gone
  if (P && loading) { loading = null; say("spinner", "on=0 why=cut"); }  // (a turn while it loads: it goes on)
  if (P && (why === "slider" || why === "jump")) { spinning = false; jumpTo(n, "jump"); return; }
  stopSharp();
  spinning = false;
  index = first(Math.max(0, Math.min(entries.length - 1, n)));
  keepNear(index);
  drawScreen(cfg.softFirst, why).then(done => {
    if (!done || !cfg.softFirst) return;  // (sharp at once: nothing comes after it)
    const token = drawToken;
    if (keepMs !== null) { keepSoft(token); return; }
    pendingSharp = setTimeout(() => {
      pendingSharp = null;
      if (token === drawToken) drawScreen(false, "sharp");
    }, between(cfg.softMin, cfg.softMax));
  });
}
function next() {
  turnTo(P ? nextScreen(index, entries.length, spread, P.cover) : index + (spread ? 2 : 1), "next");
}
function previous() {
  turnTo(P ? previousScreen(index, entries.length, spread, P.cover) : index - (spread ? 2 : 1), "previous");
}

let blackUntil = 0;
function flash(ms) {  // the window drew black, as a browser does as it gets the foreground
  stopSharp();
  drawToken++;
  spinning = false;
  const again = black;
  blackUntil = Math.max(blackUntil, now() + ms);
  black = true;
  g.fillStyle = "#000000"; g.fillRect(0, 0, view.width, view.height);
  shown = "black";
  say("black", "on=1 ms=" + ms + (again ? " again=1" : ""));
  if (again) return;  // (the black goes on: the one timer ends it)
  const end = () => {
    const left = blackUntil - now();
    if (left > 1) { setTimeout(end, left); return; }
    black = false;
    say("black", "on=0");
    drawScreen(false, "flash");
  };
  setTimeout(end, ms);
}

function spinner(ms) {  // a spinner over the page on show, for a while
  if (black || base === null) return Promise.resolve();
  spinning = true;
  const token = ++drawToken;
  const start = now();
  say("spinner", "on=1 ms=" + ms);
  return new Promise(resolve => {
    function frame() {
      if (!spinning || token !== drawToken) { resolve(); return; }
      const t = now() - start;
      if (t >= ms) {
        spinning = false;
        say("spinner", "on=0");
        drawScreen(false, "spinner").then(() => resolve());
        return;
      }
      const d = dpr();
      g.drawImage(base, 0, 0);
      const B = Math.round(cfg.band * d), x = view.width / 2, y = B + (view.height - B) / 2, r = 22 * d;
      const a = (t / 1000) * Math.PI * 2;
      g.lineCap = "round";
      g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 9 * d;
      g.beginPath(); g.arc(x, y, r, a, a + Math.PI * 1.5); g.stroke();
      g.strokeStyle = "rgba(255,255,255,0.95)"; g.lineWidth = 5 * d;
      g.beginPath(); g.arc(x, y, r, a, a + Math.PI * 1.5); g.stroke();
      code(false, true);
      shown = "spinner";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

// ------------------------------------------------------------------------------------------------ the control file
const control = { go: 0, hold: 0, sharp: 0, turns: 0 };  // (each only ever raised)
let turnsTaken = 0;  // the turns of the control file the "u" steps have taken
let polls = 0;
window.standinControl = function (c) {
  if (!c || typeof c !== "object") return;
  const bandBefore = cfg.band;
  if (typeof c.go === "number" && c.go > control.go) { control.go = c.go; say("control", "go=" + c.go); }
  if (typeof c.hold === "number" && c.hold > control.hold) { control.hold = c.hold; say("control", "hold=" + c.hold); }
  if (typeof c.sharp === "number" && c.sharp > control.sharp) { control.sharp = c.sharp; say("control", "sharp=" + c.sharp); }
  if (typeof c.turns === "number" && c.turns > control.turns) { control.turns = c.turns; say("control", "turns=" + c.turns); }
  if (typeof c.band === "number" && c.band >= 0 && c.band !== bandBefore) {
    cfg.band = c.band;
    say("control", "band=" + c.band);
    if (!black && !spinning) drawScreen(shown === "soft", "band");
  }
};
function poll() {
  if (!cfg.control) return;
  const s = document.createElement("script");
  s.src = cfg.control + "?n=" + (polls++);
  s.onload = s.onerror = () => s.remove();
  document.head.appendChild(s);
}

// ------------------------------------------------------------------------------------------------ the script
function parse(text) {
  return text.split(",").map(t => t.trim()).filter(Boolean).map(t => {
    const m = /^([gwnpjfstbmehkuva])(\d+)?(?:-(\d+))?$/.exec(t);
    if (!m) throw new Error("bad step " + t);
    return { op: m[1], a: m[2] === undefined ? null : Number(m[2]), b: m[3] === undefined ? null : Number(m[3]) };
  });
}
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(test) { while (!test()) await sleep(50); }
async function run(steps) {
  for (let k = 0; k < steps.length; k++) {
    step = k;
    const s = steps[k];
    if (s.op === "g") { say("wait", "go=" + s.a); await until(() => control.go >= s.a); say("go", "go=" + s.a); }
    else if (s.op === "w") await sleep(s.b === null ? s.a : between(s.a, s.b));
    else if (s.op === "n") { if (P) turnBy("next", "script"); else next(); }
    else if (s.op === "p") { if (P) turnBy("previous", "script"); else previous(); }
    else if (s.op === "v") {  // (a profile) the bars shown as the pointer shows them, for N ms (2000), then let go
      if (P) { setBars(true, "script"); const ms = s.a === null ? 2000 : s.a; setTimeout(() => setBars(false, "script"), ms); }
    }
    else if (s.op === "a") { if (P) setArrows(true, "script"); }  // (a profile) the side arrows as a pointer move shows them
    else if (s.op === "j") turnTo(s.a || 0, "jump");
    else if (s.op === "f") flash(s.a === null ? cfg.flashMs : s.a);
    else if (s.op === "s") await spinner(s.a || 1000);
    else if (s.op === "t") {
      [cfg.softMin, cfg.softMax] = s.a === null ? softQuery : [s.a, s.a];
      say("soft", "ms=" + cfg.softMin + "-" + cfg.softMax);
    }
    else if (s.op === "b") { cfg.factor = s.a === null ? factorQuery : Math.max(2, s.a); say("soft", "factor=" + cfg.factor); }
    else if (s.op === "m") say("mark", "id=" + s.a);
    else if (s.op === "h") { say("hold", "id=" + s.a); await until(() => control.hold >= s.a); say("held", "id=" + s.a); }
    else if (s.op === "k") { keepMs = s.a; say("soft", "keep=" + (keepMs === null ? "off" : keepMs)); }
    else if (s.op === "u") { await until(() => control.turns > turnsTaken); turnsTaken++; say("released", "turn=" + turnsTaken); }
    else if (s.op === "e") break;
  }
  say("end");
}

// ------------------------------------------------------------------------------------------------ by hand
addEventListener("keydown", e => {
  if (P && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {  // (a profile: said, with what it turned)
    e.preventDefault();
    say("key", "key=" + e.key + " trusted=" + (e.isTrusted ? 1 : 0));
    if (black) { say("lost", "why=key"); return; }
    turnBy(e.key === "ArrowLeft" ? "next" : "previous", "key");
    return;
  }
  if (e.key === "ArrowLeft") { e.preventDefault(); black ? say("lost", "why=key") : next(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); black ? say("lost", "why=key") : previous(); }
});
addEventListener("focus", () => { say("focus"); if (cfg.focusBlack) flash(cfg.flashMs); });
addEventListener("blur", () => { if (P) say("blur"); });
addEventListener("resize", () => {
  if (!sizeCanvas()) return;
  const was = spread;
  spread = spreadNow();
  if (was !== spread || P) index = first(index);
  say("size", "w=" + view.width + " h=" + view.height + " vw=" + innerWidth + " vh=" + innerHeight + " dpr=" + dpr() +
      (P ? " full=" + (fullScreen() ? 1 : 0) + " band=" + bandPx() : ""));
  if (black || spinning) return;
  if (P && P.resize === "spinner") load_then("resize", between(P.resize_ms[0], P.resize_ms[1]), () => drawProfile(false, "resize"));
  else drawScreen(false, "resize");
});

// ------------------------------------------------------------------------------------------------ the start
window.standinPages = function (list) {
  if (list && Array.isArray(list.files)) entries = list.files.map(f => (typeof f === "string" ? { url: f } : f));
};
function begin() {
  if (P) document.documentElement.style.background = document.body.style.background = GROUNDS[P.ground] || GROUND;
  if (!entries.length) entries = Array.from({ length: 40 }, (_v, n) => ({ placeholder: n }));
  sizeCanvas();
  spread = spreadNow();
  keepNear(0);
  drawScreen(false, "start").then(() => {
    say("ready", "w=" + view.width + " h=" + view.height + " vw=" + innerWidth + " vh=" + innerHeight + " dpr=" + dpr() +
        " count=" + entries.length + " cell=" + CELL + " x=" + CODE_X + " y=" + CODE_Y +
        " soft_first=" + (cfg.softFirst ? 1 : 0) + (P ? " profile=" + query.get("profile") + " band=" + bandPx() : ""));
    setInterval(poll, CONTROL_MS);
    poll();
    let steps = [];
    try { steps = parse(cfg.script); } catch (e) { say("bad_script"); }
    run(steps);
  });
}
if (cfg.pages) {
  const s = document.createElement("script");
  s.src = cfg.pages;
  s.onload = begin;
  s.onerror = begin;
  document.head.appendChild(s);
} else {
  begin();
}
</script>
</body>
</html>
