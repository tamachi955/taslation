<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stand-in reader</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2b2b; }
canvas { position: fixed; left: 0; top: 0; display: block; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script>
"use strict";
/* DEVELOPER TOOL, NOT PART OF THE APPLICATION: the browser-type stand-in viewer (tools/standin_viewer).

A page of its own, run in a throwaway browser window, that draws sample pages the way a browser-based e-book reader
does: a band at the top that is not the page, a dark ground round the page or the spread (right to left: the first
page of a spread on the right), a small page counter; every turn drawn SOFT first (the page drawn into a canvas six
times smaller and enlarged again, as the browser itself scales a canvas) and sharp a while later; BLACK for a while
when the window gets the focus, a key pressed meanwhile lost; now and then a spinner over the page. With
``soft_first=0`` in the query every turn is drawn sharp at once and nothing is drawn after it (the script's t, b and k
steps change nothing then): a viewer that never draws a page soft, for timing what TASlation itself takes.

Nothing is fetched from anywhere: no network, no external resource. The query names two files in a scratch folder,
both loaded as scripts: the page list (`pages`, `standinPages({...})`: file URLs of the pictures, read where they
are) and the control file (`control`, `standinControl({...})`, looked at every CONTROL_MS: what the driver releases).
Without a page list it draws placeholder pages of its own.

The hash holds the script (`#s=...`), steps separated by commas, run by the page itself:
  gN wait until the control file's "go" is N or more   wN wait N ms     wA-B wait A..B ms (seeded)
  n next screen    p previous screen    jN jump to page N (from 0)
  f flash black (flash_ms)    fN flash black N ms    sN spinner over the page N ms
  tN the turns after drawn soft for N ms    t the soft time of the query again
  bN the turns after drawn soft N times smaller    b the factor of the query again
  mN a mark (said in the log)    e the end
  hN wait until the control file's "hold" is N or more (a rest held until the driver lets it go)
  kN the turns after kept soft until the control file's "sharp" is their number or more (the turns kept so far,
     counted from 1), N ms at most    k drawn sharp after the soft time again
  u wait for the next turn the control file's "turns" releases (it grows by one for each: a page key TASlation
    handed on, or the driver's own release)
Arrow keys work for a person trying it by hand: Left the next screen, Right the one before (a book read right to
left).

With ``slider=1`` in the query a page slider lies under the page, as a viewer's own: a thin bar with a round knob at
the place of the screen on show, the first page at the right end (a book read right to left). It listens to the
pointer events on the canvas (pointerdown, pointermove, pointerup, pointercancel, lostpointercapture) as a common web
slider does: a press on the knob takes the pointer (setPointerCapture) and the knob follows it while the button is
held; a press on the bar puts the knob there and takes the pointer as well; the release goes to the page at the
knob's place (``ev=jump from=.. to=.. by=drag|click``; the same page: ``ev=stay``). With ``slider=2`` the page under
the knob is drawn as it moves (``why=preview``, sharp at once), as a viewer that previews the pages while its slider is
dragged; the release turns to it as ``slider=1`` does. A press elsewhere does nothing but is said (``ev=pointer``,
with the moves counted at its release), and so are the DOM's click events (``ev=click``). Without it nothing of this
is drawn or listened to.

What it does is said on the console (`STANDIN ev=... t=...`, the time in ms since the epoch; a draw with the page's
rectangle and the band's height in the canvas's pixels), which the driver reads from the browser's log; the title
stays as it is, as a reader's tab title does. A strip of cells in the band carries the screen on show (its first
page, spread or single, soft or sharp, spinner or not) for the driver to tell the frames TASlation captured apart;
nothing else reads it. */

const CONTROL_MS = 100;
const CELL = 6, CODE_X = 12, CODE_Y = 12;  // the code's cells, CSS pixels from the content's top left
const GROUND = "#2b2b2b", BAND = "#3a3d41", BAND_LINE = "#56595e", BAND_PART = "#4a4e53", COUNTER = "#9a9a9a";

const query = new URLSearchParams(location.search);
const hashed = new URLSearchParams(location.hash.slice(1));
const num = (name, fallback) => { const v = Number(query.get(name)); return query.has(name) && isFinite(v) ? v : fallback; };
const cfg = {
  token: query.get("token") || "",
  pages: query.get("pages") || "",
  control: query.get("control") || "",
  seed: num("seed", 1),
  softMin: num("soft_min", 150), softMax: num("soft_max", 400),
  factor: Math.max(2, num("factor", 6)),
  flashMs: num("flash_ms", 800),
  band: num("band", 54),
  layout: query.get("layout") || "auto",  // "auto" (spreads while the window is wider than high), "spread", "single"
  softFirst: query.get("soft_first") !== "0",  // false: every turn drawn sharp at once, nothing after it
  slider: ["1", "2"].includes(query.get("slider")) ? Number(query.get("slider")) : 0,  // the page slider under the page
  script: hashed.get("s") || "",
};
// the slider (CSS pixels): the foot under the page it lies in, the bar's ends (shares of the width; the counter on
// the right stays clear), its height, the knob's radius and how far round the knob and the bar a press takes them
const SLIDER_FOOT = 56, SLIDER_Y = 26, SLIDER_X0 = 0.12, SLIDER_X1 = 0.80, SLIDER_BAR = 4, KNOB = 8, KNOB_REACH = 14,
      BAR_REACH = 10;
const SLIDER_BAR_COLOUR = "#8a8d92", SLIDER_KNOB_COLOUR = "#e8e8e8";
const softQuery = [cfg.softMin, cfg.softMax], factorQuery = cfg.factor;  // (a script's "t" and "b" put them back)
document.title = "Stand-in reader" + (cfg.token ? " " + cfg.token : "");

// ------------------------------------------------------------------------------------------------ the log
let step = -1;
function now() { return performance.timeOrigin + performance.now(); }
function say(ev, extra) {
  console.log("STANDIN ev=" + ev + " t=" + now().toFixed(1) + " step=" + step + " page=" + index +
              " spread=" + (spread ? 1 : 0) + (extra ? " " + extra : ""));
}

// ------------------------------------------------------------------------------------------------ seeded draws
let seed = (cfg.seed >>> 0) || 1;
function random() {  // mulberry32
  seed = (seed + 0x6D2B79F5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function between(a, b) { return Math.round(a + (b - a) * random()); }

// ------------------------------------------------------------------------------------------------ the pages
let entries = [];  // {url, flip} or {placeholder: n}
const images = new Map();  // page -> Promise of a drawable

function placeholder(n) {
  const c = document.createElement("canvas");
  c.width = 830; c.height = 1170;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
  let s = (n + 1) * 7919;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  g.fillStyle = "#222222";
  for (let k = 0; k < 7; k++) g.fillRect(30 + r() * 600, 30 + r() * 950, 40 + r() * 160, 40 + r() * 160);
  g.strokeStyle = "#000000"; g.lineWidth = 4;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(120 + r() * 560, 140 + r() * 860, 70, 110, 0, 0, Math.PI * 2); g.stroke(); }
  g.font = "bold 120px sans-serif"; g.fillStyle = "#cccccc"; g.fillText(String(n + 1), 340, 640);
  return c;
}

function load(n) {
  if (n < 0 || n >= entries.length) return null;
  if (!images.has(n)) {
    const e = entries[n];
    images.set(n, e.url ? new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ img, flip: e.flip || "" });
      img.onerror = () => resolve({ img: placeholder(n), flip: "" });
      img.src = e.url;
    }) : Promise.resolve({ img: placeholder(n), flip: "" }));
  }
  return images.get(n);
}
function keepNear(n) {  // the pictures near the one on show decoded ahead; the others let go
  for (let k = n - 4; k <= n + 6; k++) load(k);
  for (const k of [...images.keys()]) if (k < n - 8 || k > n + 10) images.delete(k);
}

// ------------------------------------------------------------------------------------------------ drawing
const view = document.getElementById("view");
const g = view.getContext("2d");
let index = 0, spread = true, shown = "none", spinning = false, black = false;
let base = null;  // the screen drawn sharp last (for the spinner's frames)
let pendingSharp = null, drawToken = 0;
let keepMs = null, keptTurns = 0, keeping = 0;  // a script's "kN": the turns kept soft until the driver's word
const dpr = () => window.devicePixelRatio || 1;
const wide = img => img.naturalWidth || img.width, high = img => img.naturalHeight || img.height;

function sizeCanvas() {
  const d = dpr(), w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (view.width !== w || view.height !== h) {
    view.width = w; view.height = h;
    view.style.width = innerWidth + "px"; view.style.height = innerHeight + "px";
    return true;
  }
  return false;
}
function spreadNow() {
  return cfg.layout === "spread" || (cfg.layout !== "single" && view.width > view.height * 1.05);
}
function first(n) { return spread ? Math.max(0, n - (n % 2)) : Math.max(0, n); }
function screenPages() {
  const out = [index];
  if (spread && index + 1 < entries.length) out.push(index + 1);
  return out;
}

function band() {
  const d = dpr(), W = view.width, B = Math.round(cfg.band * d);
  g.fillStyle = BAND; g.fillRect(0, 0, W, B);
  g.fillStyle = BAND_LINE; g.fillRect(0, B - Math.max(1, Math.round(d)), W, Math.max(1, Math.round(d)));
  g.fillStyle = BAND_PART;  // the reader's own controls: a few buttons on the right, a slider in the middle
  for (let k = 0; k < 4; k++) g.fillRect(W - Math.round((44 + 40 * k) * d), Math.round(12 * d), Math.round(28 * d), Math.round(Math.min(28, cfg.band - 20) * d));
  g.fillRect(Math.round(W * 0.3), Math.round((cfg.band / 2) * d), Math.round(W * 0.35), Math.max(1, Math.round(3 * d)));
}

function code(soft, spin) {  // the screen on show, as cells: 1010, 12 bits (page, spread, soft, spinner), 4 bits of check
  const data = (index & 511) | ((spread ? 1 : 0) << 9) | ((soft ? 1 : 0) << 10) | ((spin ? 1 : 0) << 11);
  const check = ((data & 15) + ((data >> 4) & 15) * 3 + ((data >> 8) & 15) * 5 + 7) & 15;
  const bits = [1, 0, 1, 0];
  for (let k = 0; k < 12; k++) bits.push((data >> k) & 1);
  for (let k = 0; k < 4; k++) bits.push((check >> k) & 1);
  const d = dpr(), c = Math.max(1, Math.round(CELL * d)), x0 = Math.round(CODE_X * d), y0 = Math.round(CODE_Y * d);
  bits.forEach((b, k) => { g.fillStyle = b ? "#ffffff" : "#000000"; g.fillRect(x0 + k * c, y0, c, c); });
}

function rects(pics) {
  const d = dpr(), W = view.width, H = view.height, B = Math.round(cfg.band * d), m = Math.round(14 * d);
  const foot = Math.round((cfg.slider ? SLIDER_FOOT : 20) * d);
  const tall = Math.max(...pics.map(p => high(p.img)));
  const widths = pics.map(p => wide(p.img) * tall / high(p.img));
  const total = widths.reduce((a, b) => a + b, 0);
  const scale = Math.min((W - 2 * m) / total, (H - B - 2 * m - foot) / tall);
  const h = Math.max(1, Math.round(tall * scale));
  const ws = widths.map(w => Math.max(1, Math.round(w * scale)));
  const all = ws.reduce((a, b) => a + b, 0);
  let right = Math.round((W + all) / 2);
  const top = B + m + Math.round((H - B - 2 * m - foot - h) / 2);
  return ws.map(w => { const r = { x: right - w, y: top, w, h }; right -= w; return r; });  // the first on the right
}

function drawPicture(ctx, pic, r, soft) {
  const { img, flip } = pic;
  ctx.save();
  ctx.translate(r.x + (flip.includes("h") ? r.w : 0), r.y + (flip.includes("v") ? r.h : 0));
  ctx.scale(flip.includes("h") ? -1 : 1, flip.includes("v") ? -1 : 1);
  ctx.imageSmoothingEnabled = true;
  if (soft) {  // a picture of the page six times smaller (through a half-size step, then sampled), enlarged
    const hw = Math.max(1, Math.round(wide(img) / 2)), hh = Math.max(1, Math.round(high(img) / 2));
    const half = document.createElement("canvas"); half.width = hw; half.height = hh;
    const hg = half.getContext("2d"); hg.imageSmoothingQuality = "high"; hg.drawImage(img, 0, 0, hw, hh);
    const sw = Math.max(1, Math.round(wide(img) / cfg.factor)), sh = Math.max(1, Math.round(high(img) / cfg.factor));
    const small = document.createElement("canvas"); small.width = sw; small.height = sh;
    const sg = small.getContext("2d"); sg.imageSmoothingQuality = "low"; sg.drawImage(half, 0, 0, sw, sh);
    ctx.imageSmoothingQuality = "low";
    ctx.drawImage(small, 0, 0, sw, sh, 0, 0, r.w, r.h);
  } else {
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, r.w, r.h);
  }
  ctx.restore();
}

function counter() {
  const d = dpr(), W = view.width, H = view.height;
  const pages = screenPages().map(p => p + 1);
  g.fillStyle = COUNTER; g.font = Math.round(12 * d) + "px sans-serif"; g.textAlign = "right"; g.textBaseline = "bottom";
  g.fillText(pages.join("-") + " / " + entries.length, W - Math.round(16 * d), H - Math.round(6 * d));
}

// ------------------------------------------------------------------------------------------------ the slider
let dragging = null;  // a press the slider took: {id, from, by, offset, knob, moves, events}
let pressed = null;   // a press elsewhere: {id, moves}
function track() {  // the bar in the canvas's pixels: its ends and its middle's row
  const d = dpr(), W = view.width, H = view.height;
  return { x0: Math.round(W * SLIDER_X0), x1: Math.round(W * SLIDER_X1), y: H - Math.round(SLIDER_Y * d) };
}
function knobX(n) {  // the knob's place for page n: the first page at the right end
  const t = track(), last = Math.max(1, entries.length - 1);
  return Math.round(t.x1 - (Math.max(0, Math.min(last, n)) / last) * (t.x1 - t.x0));
}
function pageAtX(x) {  // the screen whose place on the bar is nearest x
  const t = track(), last = Math.max(1, entries.length - 1);
  const share = (t.x1 - Math.max(t.x0, Math.min(t.x1, x))) / Math.max(1, t.x1 - t.x0);
  return first(Math.round(share * last));
}
function slider() {  // the bar and the knob (where the pointer holds it, else at the screen's place), over the foot
  if (!cfg.slider) return;
  const d = dpr(), t = track(), r = Math.round(KNOB * d), h = Math.max(1, Math.round(SLIDER_BAR * d));
  g.fillStyle = GROUND; g.fillRect(t.x0 - r - 2, t.y - r - 2, t.x1 - t.x0 + 2 * r + 4, 2 * r + 4);
  g.fillStyle = SLIDER_BAR_COLOUR; g.fillRect(t.x0, t.y - Math.floor(h / 2), t.x1 - t.x0, h);
  g.fillStyle = SLIDER_KNOB_COLOUR;
  g.beginPath(); g.arc(dragging ? dragging.knob : knobX(index), t.y, r, 0, Math.PI * 2); g.fill();
}
function sliderPart(x, y) {  // what of the slider a press at (x, y), canvas pixels, is on: knob, bar or else
  const d = dpr(), t = track();
  if (Math.hypot(x - knobX(index), y - t.y) <= KNOB_REACH * d) return "knob";
  if (x >= t.x0 - KNOB * d && x <= t.x1 + KNOB * d && Math.abs(y - t.y) <= BAR_REACH * d) return "bar";
  return "else";
}
function pointerWords(e) {
  const d = dpr();
  return "x=" + Math.round(e.clientX * d) + " y=" + Math.round(e.clientY * d) + " buttons=" + e.buttons + " id=" +
         e.pointerId + " type=" + (e.pointerType || "") + " trusted=" + (e.isTrusted ? 1 : 0);
}
function moveKnob(x) {  // the knob held at x (canvas pixels); with slider=2 the page under it drawn
  const t = track();
  dragging.knob = Math.max(t.x0, Math.min(t.x1, Math.round(x - dragging.offset)));
  slider();
  if (cfg.slider !== 2) return;
  const n = pageAtX(dragging.knob);
  if (n === index || black) return;
  stopSharp();
  spinning = false;
  index = n;
  keepNear(index);
  drawScreen(false, "preview");
}
function endDrag(how) {  // the press the slider took is over: the release goes to the page at the knob's place
  const held = dragging, to = pageAtX(held.knob);
  dragging = null;
  try { if (view.hasPointerCapture(held.id)) view.releasePointerCapture(held.id); } catch (err) { /* (gone) */ }
  const words = "from=" + held.from + " to=" + to + " by=" + held.by + " moves=" + held.moves + " events=" +
                held.events + " how=" + how;
  if (how !== "up") {  // cancelled: no jump, the screen before the press back
    say("slider_cancel", words);
    if (index !== held.from) turnTo(held.from, "slider_cancel"); else slider();
    return;
  }
  say(to === held.from ? "stay" : "jump", words);
  if (to !== held.from) turnTo(to, "slider"); else if (index !== to) turnTo(to, "slider"); else slider();
}
if (cfg.slider) {
  view.addEventListener("pointerdown", e => {
    const d = dpr(), x = e.clientX * d, y = e.clientY * d;
    const part = black ? "else" : sliderPart(x, y);
    say("pointer", "kind=down on=" + part + " " + pointerWords(e));
    e.preventDefault();
    if (part === "else") { pressed = { id: e.pointerId, moves: 0 }; return; }
    dragging = { id: e.pointerId, from: index, by: part === "knob" ? "drag" : "click",
                 offset: part === "knob" ? x - knobX(index) : 0, knob: knobX(index), moves: 0, events: 0 };
    try { view.setPointerCapture(e.pointerId); } catch (err) { say("pointer", "kind=no_capture"); }
    moveKnob(x);
  });
  view.addEventListener("pointermove", e => {
    const many = typeof e.getCoalescedEvents === "function" ? Math.max(1, e.getCoalescedEvents().length) : 1;
    if (dragging && e.pointerId === dragging.id) {
      dragging.events++; dragging.moves += many;
      moveKnob(e.clientX * dpr());
    } else if (pressed && e.pointerId === pressed.id && e.buttons) {
      pressed.moves += many;
    }
  });
  view.addEventListener("pointerup", e => {
    say("pointer", "kind=up " + pointerWords(e));
    if (dragging && e.pointerId === dragging.id) {
      moveKnob(e.clientX * dpr());
      endDrag("up");
    } else if (pressed && e.pointerId === pressed.id) {
      say("pointer", "kind=released on=else moves=" + pressed.moves);
      pressed = null;
    }
  });
  view.addEventListener("pointercancel", e => {
    say("pointer", "kind=cancel " + pointerWords(e));
    if (dragging && e.pointerId === dragging.id) endDrag("cancel");
    if (pressed && e.pointerId === pressed.id) pressed = null;
  });
  view.addEventListener("lostpointercapture", e => {
    say("pointer", "kind=lost " + pointerWords(e));
    if (dragging && e.pointerId === dragging.id) endDrag("lost");
  });
  view.addEventListener("click", e => {
    const d = dpr();
    say("click", "on=" + (black ? "else" : sliderPart(e.clientX * d, e.clientY * d)) + " " + pointerWords(e));
  });
}

async function drawScreen(soft, why) {
  const token = ++drawToken;
  const began = now();
  const pics = await Promise.all(screenPages().map(load));
  if (token !== drawToken || black) return false;  // another drawing came meanwhile
  sizeCanvas();
  g.fillStyle = GROUND; g.fillRect(0, 0, view.width, view.height);
  const rs = rects(pics);
  pics.forEach((p, k) => drawPicture(g, p, rs[k], soft));
  band(); counter(); slider(); code(soft, false);
  shown = soft ? "soft" : "sharp";
  if (!soft) {
    base = document.createElement("canvas"); base.width = view.width; base.height = view.height;
    base.getContext("2d").drawImage(view, 0, 0);
  }
  // where the page is (both pages of a spread) and how high the band is, in the canvas's pixels
  const box = [Math.min(...rs.map(r => r.x)), Math.min(...rs.map(r => r.y)),
               Math.max(...rs.map(r => r.x + r.w)), Math.max(...rs.map(r => r.y + r.h))];
  say("draw", "state=" + shown + " why=" + why + " wait=" + Math.round(now() - began) + " box=" + box.join(",") +
      " band=" + Math.round(cfg.band * dpr()));
  return true;
}

function stopSharp() {  // the sharp draw due no longer comes (a turn kept soft says so)
  if (pendingSharp !== null) { clearTimeout(pendingSharp); pendingSharp = null; }
  if (keeping) { say("kept", "n=" + keeping + " why=gone"); keeping = 0; }
}
function keepSoft(token) {  // the turn on show kept soft until the control file's "sharp" reaches it, keepMs at most
  const turn = ++keptTurns, end = now() + keepMs;
  keeping = turn;
  say("keep", "n=" + turn + " ms=" + keepMs);
  const look = () => {
    pendingSharp = null;
    if (token !== drawToken) { if (keeping === turn) { say("kept", "n=" + turn + " why=gone"); keeping = 0; } return; }
    const word = control.sharp >= turn;
    if (!word && now() < end) { pendingSharp = setTimeout(look, 50); return; }
    keeping = 0;
    say("kept", "n=" + turn + " why=" + (word ? "word" : "time"));
    drawScreen(false, "sharp");
  };
  pendingSharp = setTimeout(look, 50);
}

function turnTo(n, why) {
  if (black) { say("lost", "why=" + why); return; }  // a key in the black: gone
  stopSharp();
  spinning = false;
  index = first(Math.max(0, Math.min(entries.length - 1, n)));
  keepNear(index);
  drawScreen(cfg.softFirst, why).then(done => {
    if (!done || !cfg.softFirst) return;  // (sharp at once: nothing comes after it)
    const token = drawToken;
    if (keepMs !== null) { keepSoft(token); return; }
    pendingSharp = setTimeout(() => {
      pendingSharp = null;
      if (token === drawToken) drawScreen(false, "sharp");
    }, between(cfg.softMin, cfg.softMax));
  });
}
function next() { turnTo(index + (spread ? 2 : 1), "next"); }
function previous() { turnTo(index - (spread ? 2 : 1), "previous"); }

let blackUntil = 0;
function flash(ms) {  // the window drew black, as a browser does as it gets the foreground
  stopSharp();
  drawToken++;
  spinning = false;
  const again = black;
  blackUntil = Math.max(blackUntil, now() + ms);
  black = true;
  g.fillStyle = "#000000"; g.fillRect(0, 0, view.width, view.height);
  shown = "black";
  say("black", "on=1 ms=" + ms + (again ? " again=1" : ""));
  if (again) return;  // (the black goes on: the one timer ends it)
  const end = () => {
    const left = blackUntil - now();
    if (left > 1) { setTimeout(end, left); return; }
    black = false;
    say("black", "on=0");
    drawScreen(false, "flash");
  };
  setTimeout(end, ms);
}

function spinner(ms) {  // a spinner over the page on show, for a while
  if (black || base === null) return Promise.resolve();
  spinning = true;
  const token = ++drawToken;
  const start = now();
  say("spinner", "on=1 ms=" + ms);
  return new Promise(resolve => {
    function frame() {
      if (!spinning || token !== drawToken) { resolve(); return; }
      const t = now() - start;
      if (t >= ms) {
        spinning = false;
        say("spinner", "on=0");
        drawScreen(false, "spinner").then(() => resolve());
        return;
      }
      const d = dpr();
      g.drawImage(base, 0, 0);
      const B = Math.round(cfg.band * d), x = view.width / 2, y = B + (view.height - B) / 2, r = 22 * d;
      const a = (t / 1000) * Math.PI * 2;
      g.lineCap = "round";
      g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 9 * d;
      g.beginPath(); g.arc(x, y, r, a, a + Math.PI * 1.5); g.stroke();
      g.strokeStyle = "rgba(255,255,255,0.95)"; g.lineWidth = 5 * d;
      g.beginPath(); g.arc(x, y, r, a, a + Math.PI * 1.5); g.stroke();
      code(false, true);
      shown = "spinner";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

// ------------------------------------------------------------------------------------------------ the control file
const control = { go: 0, hold: 0, sharp: 0, turns: 0 };  // (each only ever raised)
let turnsTaken = 0;  // the turns of the control file the "u" steps have taken
let polls = 0;
window.standinControl = function (c) {
  if (!c || typeof c !== "object") return;
  const bandBefore = cfg.band;
  if (typeof c.go === "number" && c.go > control.go) { control.go = c.go; say("control", "go=" + c.go); }
  if (typeof c.hold === "number" && c.hold > control.hold) { control.hold = c.hold; say("control", "hold=" + c.hold); }
  if (typeof c.sharp === "number" && c.sharp > control.sharp) { control.sharp = c.sharp; say("control", "sharp=" + c.sharp); }
  if (typeof c.turns === "number" && c.turns > control.turns) { control.turns = c.turns; say("control", "turns=" + c.turns); }
  if (typeof c.band === "number" && c.band >= 0 && c.band !== bandBefore) {
    cfg.band = c.band;
    say("control", "band=" + c.band);
    if (!black && !spinning) drawScreen(shown === "soft", "band");
  }
};
function poll() {
  if (!cfg.control) return;
  const s = document.createElement("script");
  s.src = cfg.control + "?n=" + (polls++);
  s.onload = s.onerror = () => s.remove();
  document.head.appendChild(s);
}

// ------------------------------------------------------------------------------------------------ the script
function parse(text) {
  return text.split(",").map(t => t.trim()).filter(Boolean).map(t => {
    const m = /^([gwnpjfstbmehku])(\d+)?(?:-(\d+))?$/.exec(t);
    if (!m) throw new Error("bad step " + t);
    return { op: m[1], a: m[2] === undefined ? null : Number(m[2]), b: m[3] === undefined ? null : Number(m[3]) };
  });
}
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(test) { while (!test()) await sleep(50); }
async function run(steps) {
  for (let k = 0; k < steps.length; k++) {
    step = k;
    const s = steps[k];
    if (s.op === "g") { say("wait", "go=" + s.a); await until(() => control.go >= s.a); say("go", "go=" + s.a); }
    else if (s.op === "w") await sleep(s.b === null ? s.a : between(s.a, s.b));
    else if (s.op === "n") next();
    else if (s.op === "p") previous();
    else if (s.op === "j") turnTo(s.a || 0, "jump");
    else if (s.op === "f") flash(s.a === null ? cfg.flashMs : s.a);
    else if (s.op === "s") await spinner(s.a || 1000);
    else if (s.op === "t") {
      [cfg.softMin, cfg.softMax] = s.a === null ? softQuery : [s.a, s.a];
      say("soft", "ms=" + cfg.softMin + "-" + cfg.softMax);
    }
    else if (s.op === "b") { cfg.factor = s.a === null ? factorQuery : Math.max(2, s.a); say("soft", "factor=" + cfg.factor); }
    else if (s.op === "m") say("mark", "id=" + s.a);
    else if (s.op === "h") { say("hold", "id=" + s.a); await until(() => control.hold >= s.a); say("held", "id=" + s.a); }
    else if (s.op === "k") { keepMs = s.a; say("soft", "keep=" + (keepMs === null ? "off" : keepMs)); }
    else if (s.op === "u") { await until(() => control.turns > turnsTaken); turnsTaken++; say("released", "turn=" + turnsTaken); }
    else if (s.op === "e") break;
  }
  say("end");
}

// ------------------------------------------------------------------------------------------------ by hand
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); black ? say("lost", "why=key") : next(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); black ? say("lost", "why=key") : previous(); }
});
addEventListener("focus", () => { say("focus"); flash(cfg.flashMs); });
addEventListener("resize", () => {
  if (!sizeCanvas()) return;
  const was = spread;
  spread = spreadNow();
  if (was !== spread) index = first(index);
  say("size", "w=" + view.width + " h=" + view.height + " vw=" + innerWidth + " vh=" + innerHeight + " dpr=" + dpr());
  if (!black && !spinning) drawScreen(false, "resize");
});

// ------------------------------------------------------------------------------------------------ the start
window.standinPages = function (list) {
  if (list && Array.isArray(list.files)) entries = list.files.map(f => (typeof f === "string" ? { url: f } : f));
};
function begin() {
  if (!entries.length) entries = Array.from({ length: 40 }, (_v, n) => ({ placeholder: n }));
  sizeCanvas();
  spread = spreadNow();
  keepNear(0);
  drawScreen(false, "start").then(() => {
    say("ready", "w=" + view.width + " h=" + view.height + " vw=" + innerWidth + " vh=" + innerHeight + " dpr=" + dpr() +
        " count=" + entries.length + " cell=" + CELL + " x=" + CODE_X + " y=" + CODE_Y +
        " soft_first=" + (cfg.softFirst ? 1 : 0));
    setInterval(poll, CONTROL_MS);
    poll();
    let steps = [];
    try { steps = parse(cfg.script); } catch (e) { say("bad_script"); }
    run(steps);
  });
}
if (cfg.pages) {
  const s = document.createElement("script");
  s.src = cfg.pages;
  s.onload = begin;
  s.onerror = begin;
  document.head.appendChild(s);
} else {
  begin();
}
</script>
